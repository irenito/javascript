<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nacionalidade</title>
</head>
<body>
    <h1>Você é ...</h1>
    País em que nasceu <input type="text" name="txtpais" id="txtpais">
    <input type="button" value="Verificar" onclick="resposta()">
    <div id="res"></div>

    <script>
        function resposta(){
            var pais = window.document.getElementById('txtpais')
            var resp = window.document.querySelector('div#res')

            resp.innerHTML = `<p>Você nasceu no ${pais}.</p>`

            if(pais == 'Brasil'){
                resp.innerHTML += `<p>Você é brasileiro.</p>`
            } else{
                resp.innerHTML += `<p>Você é estrangeiro.</p>`
            }
        }
    </script>
</body>
</html>
