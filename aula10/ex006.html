<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        div#area{
            background: green;
            color: white;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            font: normal 18pt arial;
        }
    </style>
</head>
<body>
    <div id="area" onclick="clicar()" onmouseenter="entrar()"> <!-- os eventos DOM podem ser configurados no HTML ou no JS -->
        Interaja
     </div>

     <script>
        function clicar(){
            var a = window.document.getElementById('area')
            a.innerText = 'Clicou!'
            a.style.background = 'red'
        }
        function entrar(){
            var a = window.document.getElementById('area')
            a.innerText = 'Entrou!'
            a.style.background = 'gray'
        }
     </script>
</body>
</html>
