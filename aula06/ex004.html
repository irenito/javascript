<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tratamento de dados</title>
    <style>
        body{
            font: normal 20pt arial;
        }
    </style>
</head>
<body>
    <script>
        var nome = window.prompt('Qual é o seu nome?')
        document.write(`Olá, <strong>${nome}</strong> ! Seu nome tem ${nome.length} letras.<br>`)
        document.write(`Seu nome em maiuscula é ${nome.toUpperCase()}.<br/>`) // <br/> ou <br> é uma tag vazia, não tem conteudo, portanto não precisa de fechamento, como <p></p>. O / significa que a tag está sendo fechada nela mesma.
        document.write(`Seu nome em minuscula é ${nome.toLowerCase()}.`)
    </script>
</body>
</html>
